<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js 详细基础模板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <!-- 引入 Three.js 核心库 -->
    <script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
				}
			}
		</script>

    <script type="module">
        // 1. 导入 Three.js 核心模块及扩展插件
        import * as THREE from 'three';
        // 导入轨道控制器，允许用户用鼠标旋转、平移、缩放3D场景
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TrackballControls } from 'three/addons/controls/TrackballControls.js';

        // 2. 场景
        const scene = new THREE.Scene();
        // 设置场景的背景色
        scene.background = new THREE.Color(0x333333);
        // 可选：添加雾效。离相机越远的地方越模糊，颜色趋向于指定颜色
        scene.fog = new THREE.Fog(0x333333, 5, 20);

        // 3. 相机
        // 相机决定了从什么角度、什么视野观察场景
        // PerspectiveCamera: 透视相机，模拟人眼近大远小的效果
        // 参数 1: FOV (Field of View) 视野角度，75度是常见值
        // 参数 2: 长宽比，通常使用浏览器窗口的宽除以高
        // 参数 3: 近裁剪面，距离相机小于此值的物体不会被渲染 (防止太近挡住视线)
        // 参数 4: 远裁剪面，距离相机大于此值的物体不会被渲染 (优化性能)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 设置相机在空间中的位置 (x, y, z 轴坐标)
        // 默认在原点(0,0,0)，我们把它往Z轴正方向移动5个单位，往后退一点，以便看到原点处的物体
        camera.position.set(0, 2, 5);

        // 4. 渲染器
        // 负责将场景和相机的数据计算并绘制到网页的 <canvas> 元素上
        const renderer = new THREE.WebGLRenderer({
            antialias: true, // 开启抗锯齿，让物体边缘更平滑
        });

        // 设置渲染器输出画布的尺寸，这里设为全屏
        renderer.setSize(window.innerWidth, window.innerHeight);

        // 设置设备像素比，防止在高分辨率屏幕（如苹果Retina屏）上画面模糊
        renderer.setPixelRatio(window.devicePixelRatio);

        // 启用阴影贴图。只有开启了这个，物体才能投射和接收阴影
        renderer.shadowMap.enabled = true;

        // 将渲染器生成的 <canvas> 元素添加到 HTML 的 <body> 标签中
        document.body.appendChild(renderer.domElement);

        // 5. 控制器
        const controls = new TrackballControls(camera, renderer.domElement);

        // 开启阻尼效果，让鼠标拖拽旋转有一种“惯性”的感觉
        controls.enableDamping = true;

        // 设置阻尼系数，0.05 是一个比较舒服的值
        controls.dampingFactor = 0.05;

        // 可选：禁止相机平移 (默认开启，右键拖拽可平移)
        // controls.enablePan = false;

        // 6. 灯光
        // 如果没有灯光，使用 MeshStandardMaterial 的物体会一片漆黑

        // 环境光：均匀照亮场景中的所有物体，没有方向性，不会产生阴影
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); // 颜色，强度
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff0000, 10, 1);
        scene.add(pointLight);

        // 平行光：模拟太阳光，光线平行，能产生清晰的阴影
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);

        directionalLight.position.set(5, 5, 5); // 设置光源位置

        // 开启此灯光投射阴影
        directionalLight.castShadow = true;

        // 配置阴影的分辨率（越大越清晰，越耗性能）
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // 7. 创建 3D 物体
        // 一个 3D 物体通常由：几何体 + 材质 = 网格 组成

        // --- 物体 1：旋转的立方体 ---
        // BoxGeometry: 立方体几何体 (宽度, 高度, 深度)
        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

        // MeshStandardMaterial: 标准物理材质，对光照有真实反应，能产生阴影
        const boxMaterial = new THREE.MeshStandardMaterial({
            color: 0x00aaff, // 材质颜色 (蓝色)
            metalness: 0.3, // 金属度 (0非金属，1纯金属)
            roughness: 0.5, // 粗糙度 (0镜面光滑，1完全哑光)
        });

        // 将几何体和材质组合成 Mesh (网格)
        const cube = new THREE.Mesh(boxGeometry, boxMaterial);
        cube.position.set(0, 1, 0); // 让立方体悬浮一点高度
        cube.castShadow = true; // 让立方体投射阴影
        scene.add(cube);

        // --- 物体 2：地面平面，用来接收阴影 ---
        const planeGeometry = new THREE.PlaneGeometry(20, 20); // 宽20，高20的平面
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);

        // 平面默认是竖直的，需要绕 X 轴旋转 -90度 变成水平地面
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = 0; // 放在 y=0 的水平面
        plane.receiveShadow = true; // 让地面接收其他物体投射的阴影
        scene.add(plane);

        // 8. 动画循环
        // 每秒大概60次不断重绘画面，形成动画
        // 使用 Clock 来获取时间差，保证动画速度不受帧率影响
        const clock = new THREE.Clock();

        function animate() {
            // requestAnimationFrame: 告诉浏览器在下次重绘前调用该函数
            requestAnimationFrame(animate);

            // 获取自上一帧以来的时间差 (秒)
            const elapsedTime = clock.getElapsedTime();

            // --- 更新物体状态 ---
            // 让立方体绕 Y 轴旋转，速度和时间挂钩
            cube.rotation.y = elapsedTime * 0.5;
            // 让立方体上下浮动 (使用正弦函数模拟波浪起伏)
            cube.position.y = 1 + Math.sin(elapsedTime) * 0.2;

            // --- 更新控制器 ---
            // 如果开启了 enableDamping，必须在每一帧调用 update()
            controls.update();

            // --- 渲染画面 ---
            // 将当前的场景 和相机 传递给渲染器进行绘制
            renderer.render(scene, camera);
        }

        // 启动动画循环
        animate();

        // 9. 响应式窗口缩放
        // 当用户改变浏览器窗口大小时，画面需要自适应
        window.addEventListener('resize', () => {
            // 1. 更新相机的长宽比
            camera.aspect = window.innerWidth / window.innerHeight;

            // 2. 更新相机的投影矩阵 (Three.js 内部计算必须步骤)
            camera.updateProjectionMatrix();

            // 3. 更新渲染器画布大小
            renderer.setSize(window.innerWidth, window.innerHeight);

            // 4. 更新渲染器像素比
            renderer.setPixelRatio(window.devicePixelRatio);
        });
    </script>
</body>

</html>
