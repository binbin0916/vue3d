	<title>iconfont 图标库</title>
	<link rel="stylesheet" href="./iconfont.css" />
	<style>
		:root { --fg:#1f2329; --muted:#8a919f; --line:#eceef1; --hover:#f5f7fa; --accent:#3b82f6; }
		* { box-sizing: border-box; }
		body { margin:0; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--fg); background:#fff; }
		header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:16px; padding:18px 24px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.9); backdrop-filter:blur(8px); }
		h1 { margin:0; font-size:16px; font-weight:600; white-space:nowrap; }
		#search { flex:1; max-width:360px; height:36px; padding:0 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; outline:none; }
		#search:focus { border-color:var(--accent); }
		#count { margin-left:auto; color:var(--muted); font-size:13px; }
		main { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; padding:24px; }
		.cell { display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 8px; border:1px solid var(--line); border-radius:10px; cursor:pointer; transition:.15s; }
		.cell:hover { border-color:var(--accent); background:var(--hover); }
		.cell .iconfont { font-size:28px; color:var(--fg); }
		.cell .name { font-size:11px; color:var(--muted); text-align:center; word-break:break-all; line-height:1.4; }
		.cell .code { font-size:10px; color:#c2c7d0; font-family:ui-monospace,Consolas,monospace; }
		#toast { position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(12px); background:#1f2329; color:#fff; padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; }
		#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
	</style>
</head>

		var grid = document.getElementById('grid');

		var timer;
		function showToast(t) { toast.textContent = t; toast.classList.add('show'); clearTimeout(timer); timer = setTimeout(function () { toast.classList.remove('show'); }, 1400); }
		function fallback(t) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); showToast('已复制 ' + t); } catch (e) {} document.body.removeChild(ta); }
		function copy(t) { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function () { showToast('已复制 ' + t); }, function () { fallback(t); }); } else { fallback(t); } }
		function render(list) {
			grid.innerHTML = '';
			var frag = document.createDocumentFragment();
			list.forEach(function (it) {
				var cell = document.createElement('div'); cell.className = 'cell'; cell.title = '点击复制 ' + it.cls;
				var i = document.createElement('i'); i.className = 'iconfont ' + it.cls;
				var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = it.name;
				var cd = document.createElement('div'); cd.className = 'code'; cd.textContent = 'U+' + it.code.toUpperCase();
				cell.appendChild(i); cell.appendChild(nm); cell.appendChild(cd);

			grid.appendChild(frag);

		}
		document.getElementById('search').addEventListener('input', function (e) {
